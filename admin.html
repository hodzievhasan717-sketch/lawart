<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Редакция — Lawart</title>
<meta name="description" content="Lawart.uz — электронный научный журнал юридических статей Узбекистана. Научные статьи по праву в PDF, публикация статей для студентов, магистрантов и юристов. Huquqiy ilmiy maqolalar jurnali.">
<meta name="keywords" content="Lawart, юридический журнал, научные статьи по праву, публикация статей Узбекистан, право Узбекистана, huquqiy maqolalar, ilmiy jurnal, ТГЮУ">
<meta name="robots" content="index,follow,max-image-preview:large">
<meta property="og:image" content="https://lawart.uz/assets/og.png">
<meta property="og:locale" content="ru_RU">
<meta property="og:title" content="Редакция — Lawart">
<meta property="og:description" content="Научный журнал, где право становится искусством аргумента.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Lawart">
<meta name="theme-color" content="#0b0c10">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" href="/icon-192.png" type="image/png" sizes="192x192">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<meta property="og:site_name" content="Lawart">
<meta name="application-name" content="Lawart">
<script>try{var th=localStorage.getItem('lawart-theme');if(th)document.documentElement.dataset.theme=th;var lg=localStorage.getItem('lawart-lang');if(lg)document.documentElement.lang=lg}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://xgwzpygoewtfeexraats.supabase.co">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500;1,600&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css?v=20261127c">
</head>
<body>
<main class="wrap dash wide">
  <aside class="side-nav">
    <div class="me"><span class="kicker">Редакция</span><b id="meName"></b><span>Lawart.uz</span></div>
    <button data-v="queue" class="on"><span>Заявки</span><span class="cnt hidden" id="cntQ"></span></button>
    <button data-v="inbox"><span>Сообщения</span><span class="cnt hidden" id="cntM"></span></button>
    <button data-v="published"><span>Опубликованные</span></button>
    <button data-v="rejected"><span>Отклоненные</span></button>
    <button data-v="upload"><span>+ Статья в архив</span></button>
    <button data-v="news"><span>Новости и интересное</span></button>
    <button data-v="authors"><span>Пользователи</span><span class="cnt hidden" id="cntU"></span></button>
    <button id="logout"><span>Выйти</span></button>
  </aside>
  <section id="view"></section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/key.js"></script>
<script src="assets/config.js?v=20261127c"></script>
<script src="assets/i18n.js?v=20261127c"></script>
<script src="assets/offer.js?v=20261127c"></script>
<script src="assets/app.js?v=20261127c"></script>
<script>
(async () => {
  if (!(await requireAuth())) return;
  await boot("", { noBook: true });
  if (!ME.profile?.is_admin) { $("main").innerHTML = `<div class="empty-state" style="grid-column:1/-1"><div class="es-ic">§</div><b>Нет доступа</b>Этот раздел только для редакции. <a href="cabinet.html">В кабинет автора</a></div>`; return; }
  $("#meName").textContent = ME.profile.full_name || ME.user.email;
  $("#logout").onclick = async () => { await sb.auth.signOut(); };
  let stopChat = null;
  const V = { user, queue, inbox, published: () => listBy(["published"], "Опубликованные"), rejected: () => listBy(["rejected"], "Отклоненные"), upload, news, authors, detail };
  $$(".side-nav [data-v]").forEach(b => b.onclick = () => go(b.dataset.v));
  function go(v, id, extra = "") {
    if (stopChat) { stopChat(); stopChat = null; }
    $$(".side-nav [data-v]").forEach(b => b.classList.toggle("on", b.dataset.v === (v === "detail" ? "queue" : v === "user" ? "authors" : v)));
    history.replaceState(null, "", "admin.html" + (v === "user" ? "?u=" + id : id ? "?a=" + id + extra : (v !== "queue" ? "#" + v : "")));
    V[v](id); scrollTo({ top: 0, behavior: "smooth" });
  }
  async function counts() {
    const { count } = await sb.from("articles").select("id", { count: "exact", head: true }).eq("status", "pending");
    $("#cntQ").textContent = count || 0; $("#cntQ").classList.toggle("hidden", !count);
    const r = await sb.rpc("admin_threads"), r2 = await sb.rpc("admin_dm_threads");
    const un = (r.data || []).reduce((s, x) => s + (x.unread || 0), 0) + (r2.data || []).reduce((s, x) => s + (x.unread || 0), 0);
    $("#cntM").textContent = un; $("#cntM").classList.toggle("hidden", !un);
  }
  counts(); setInterval(counts, 15000);

  function rows(data, empty) {
    return data?.length ? data.map(a => `<div class="sub" data-id="${a.id}"><div><h4>${esc(a.title)}</h4>
      <span class="muted" style="font-size:.86rem">№${pad(a.id)} · ${esc(authorNames(a.authors).join(", "))} · ${esc(a.category)} · ${fmtDate(a.updated_at || a.created_at)}</span></div>
      <div class="sub-actions">${badge(a.status)}<button class="btn ghost sm" data-chat="${a.id}" title="Написать автору">${ICON.chat}Написать</button></div></div>`).join("")
      : `<div class="empty-state" style="padding:40px"><b>${empty}</b></div>`;
  }
  function bindRows() {
    $$(".sub[data-id]").forEach(s => s.onclick = e => { if (e.target.closest("[data-chat]")) return; go("detail", s.dataset.id); });
    $$("[data-chat]").forEach(b => b.onclick = e => { e.stopPropagation(); go("detail", b.dataset.chat, "&chat=1"); });
  }

  async function queue() {
    const [st, q, ppl] = await Promise.all([
      sb.rpc("journal_stats"),
      sb.from("articles").select("id,title,authors,category,status,created_at,updated_at").in("status", ["pending", "revision", "accepted"]).order("updated_at", { ascending: false }),
      sb.from("profiles").select("id", { count: "exact", head: true })
    ]);
    const data = q.data || [];
    const pend = data.filter(a => a.status === "pending"), rev = data.filter(a => a.status === "revision"), acc = data.filter(a => a.status === "accepted");
    $("#view").innerHTML = `<div class="kpis">
        <div class="kpi"><b>${pend.length}</b><small>ждут проверки</small></div>
        <div class="kpi"><b>${rev.length}</b><small>у авторов на правках</small></div>
        <div class="kpi"><b>${st.data?.articles || 0}</b><small>опубликовано</small></div>
        <div class="kpi"><b>${ppl.count || 0}</b><small>зарегистрировано</small></div></div>
      <div class="kpis" style="grid-template-columns:1fr 1fr">
        <div class="kpi"><b>${num(st.data?.views || 0)}</b><small>прочтений статей</small></div>
        <div class="kpi"><b>${num(st.data?.downloads || 0)}</b><small>скачиваний PDF</small></div></div>
      <div class="panel"><h2>Ждут проверки</h2><div class="sub-list">${rows(pend, "Новых заявок нет")}</div></div>
      <div class="panel"><h2>Одобрены, ждут оплаты</h2><div class="sub-list">${rows(acc, "Пусто")}</div></div>
      <div class="panel"><h2>На доработке у авторов</h2><div class="sub-list">${rows(rev, "Пусто")}</div></div>`;
    bindRows();
  }
  async function listBy(statuses, title) {
    const { data } = await sb.from("articles").select("id,title,authors,category,status,created_at,updated_at,featured").in("status", statuses).order("updated_at", { ascending: false });
    $("#view").innerHTML = `<div class="panel"><h2>${title}</h2><div class="sub-list">${rows(data, "Пусто")}</div></div>`;
    bindRows();
  }

  async function inbox() {
    $("#view").innerHTML = `<div class="panel"><h2>Сообщения</h2><p class="muted">Одна переписка на каждого автора: личные сообщения и вопросы по всем его статьям в одной ленте.</p><div id="thr">Загрузка…</div></div>`;
    const r = await sb.rpc("admin_threads"), r2 = await sb.rpc("admin_dm_threads");
    const th = r.data || [], dms = r2.data || [];
    const aids = [...new Set(th.map(x => x.article_id))];
    const own = {};
    if (aids.length) { const q = await sb.from("articles").select("id,author_id").in("id", aids); (q.data || []).forEach(a => own[a.id] = a.author_id); }
    const G = {};
    const put = (key, o) => {
      const g = G[key] || (G[key] = { key, unread: 0, last_at: null, n: 0 });
      g.unread += o.unread || 0; g.n += o.art ? 1 : 0;
      if (!g.person && o.person) g.person = o.person;
      if (!g.name && o.name) g.name = o.name;
      if (!g.user && o.user) g.user = o.user;
      if (!g.article && o.article) g.article = o.article;
      if (!g.last_at || new Date(o.last_at) > new Date(g.last_at)) { g.last_at = o.last_at; g.last = o.last; g.fromThem = o.fromThem; }
    };
    dms.forEach(x => put("u" + x.user_id, { user: x.user_id, person: x, name: x.full_name, unread: x.unread, last_at: x.last_at, last: x.last_body || "", fromThem: x.last_from_user }));
    th.forEach(x => { const u = own[x.article_id]; put(u ? "u" + u : "a" + x.article_id, { user: u, article: x.article_id, art: 1, name: x.author_name, unread: x.unread, last_at: x.last_at, last: x.last_body || (x.last_file ? "📄 " + x.last_file : ""), fromThem: x.last_from_author }); });
    const list = Object.values(G).sort((a, b) => new Date(b.last_at) - new Date(a.last_at));
    $("#thr").innerHTML = list.map(g => `<div class="thread ${g.unread ? "unread" : ""}" ${g.user ? `data-u="${g.user}"` : `data-id="${g.article}"`}>
        ${g.person ? avatarHTML(g.person, "sm") : `<span class="avatar sm">${esc(initials(g.name || "?"))}</span>`}
        <div><b>${esc(g.name || "Автор")}${g.n ? ` · статей в переписке: ${g.n}` : ""}</b><p>${g.fromThem ? "" : "Вы: "}${esc(g.last || "")}</p></div>
        <div style="text-align:right"><small class="muted">${fmtTime(g.last_at)}</small><br>${g.unread ? `<span class="cnt">${g.unread}</span>` : ""}</div></div>`).join("")
      || `<div class="empty-state" style="padding:40px"><b>Переписок пока нет</b>Откройте заявку и нажмите «Написать» или напишите пользователю в разделе «Пользователи».</div>`;
    $$(".thread[data-id]").forEach(x => x.onclick = () => go("detail", x.dataset.id, "&chat=1"));
    $$(".thread[data-u]").forEach(x => x.onclick = () => go("user", x.dataset.u));
  }

  async function detail(id) {
    const { data: a } = await sb.from("articles").select("*").eq("id", id).maybeSingle();
    if (!a) return queue();
    readNotifFor("admin.html?a=" + id);
    let au = null;
    if (a.author_id) { const r = await sb.rpc("admin_person", { p_id: a.author_id }); au = r.data; }
    const url = await signedUrl("papers", a.pdf_path, 3600 * 3);
    const own = a.author_id === ME.user.id;
    $("#view").innerHTML = `<button class="back" id="back">← К заявкам</button>
      <div class="adm-grid">
        <div class="panel">
          <div class="detail-head"><div><span class="tag-cat">${esc(a.category)} · №${pad(a.id)}</span><h2 style="max-width:640px;margin-top:10px">${esc(a.title)}</h2></div>${badge(a.status)}</div>
          <p><b>${esc(a.authors)}</b></p>
          <div class="meta-grid">
            <div><small>Аккаунт автора</small>${esc(au?.full_name || "—")}</div>
            <div><small>Email</small>${au?.email ? `<a href="mailto:${esc(au.email)}">${esc(au.email)}</a>` : "—"}</div>
            <div><small>Телефон</small>${au?.phone ? `<a href="tel:${esc(au.phone)}">${esc(au.phone)}</a>` : "—"}</div>
            <div><small>Организация</small>${esc(au?.organization || "—")}</div>
            <div><small>Подана</small>${fmtDate(a.created_at)}</div>
            <div><small>Язык · страниц</small>${esc(LANGS[a.lang] || a.lang)} · ${a.pages || "?"}</div>
          </div>
          <p style="white-space:pre-wrap">${esc(a.abstract)}</p>
          ${a.keywords ? `<p class="muted"><b>Ключевые слова:</b> ${esc(a.keywords)}</p>` : ""}
          ${url ? `<div class="pdf-wrap"><div class="pdf-bar"><b>Текст статьи</b><a class="btn ghost sm" href="${url}" target="_blank" rel="noopener">Открыть PDF</a></div><iframe src="${url}#view=FitH" style="height:70vh"></iframe></div>` : `<p class="muted">Файл не прикреплен</p>`}
          <label style="margin-top:22px">Комментарий для автора <small>(виден автору в кабинете)</small></label>
          <textarea id="note" style="min-height:90px">${esc(a.admin_note)}</textarea>
          <div class="actions">
            ${a.status !== "published" ? `<button class="btn green" data-s="published">Опубликовать</button>` : `<a class="btn green" href="article.html?id=${a.id}">Открыть на сайте</a>`}
            ${["pending", "revision"].includes(a.status) ? `<button class="btn gold" data-s="accepted">Одобрить, ждем оплату</button>` : ""}
            ${a.status !== "revision" ? `<button class="btn amber" data-s="revision">На доработку</button>` : ""}
            ${a.status !== "rejected" ? `<button class="btn ghost" data-s="rejected">Отклонить</button>` : ""}
            ${["published", "rejected"].includes(a.status) ? `<button class="btn ghost" data-s="pending">Вернуть в проверку</button>` : ""}
          </div>
          <div class="actions" style="align-items:center">
            <label class="switch"><input type="checkbox" id="paid" ${a.paid ? "checked" : ""}> Оплата получена${a.paid_at ? ` <small class="muted">(${fmtDate(a.paid_at)})</small>` : ""}</label>
            <label class="switch"><input type="checkbox" id="feat" ${a.featured ? "checked" : ""}> Выбор редакции на главной</label>
            ${a.status === "published" ? `<button class="btn ghost sm" id="thumbBtn">Обновить обложку из PDF</button>` : ""}
            <button class="btn ghost sm" id="del" style="margin-left:auto;color:var(--ox);border-color:var(--ox)">Удалить</button>
          </div>
        </div>
        <div class="adm-chat" id="chatBox">${own ? `<div class="panel"><b>Это ваша статья</b><p class="muted">Переписка нужна только со сторонними авторами.</p></div>` : ""}</div>
      </div>`;
    $("#back").onclick = () => go("queue");
    if (!own && a.author_id) stopChat = mountChat($("#chatBox"), a, { peer: au?.full_name || authorNames(a.authors)[0] || "Автор", focus: !!qs("chat"), onSend: counts });

    $$("[data-s]").forEach(b => b.onclick = async () => {
      const s = b.dataset.s;
      const word = { accepted: "одобрить статью и перейти к оплате", published: "опубликовать статью", revision: "вернуть статью автору на доработку", rejected: "отклонить статью", pending: "вернуть статью в проверку" }[s];
      if (!(await confirmBox(`Точно ${word}?`, s === "published" ? (a.paid || own ? "Статья сразу появится в открытом архиве, автор получит уведомление." : "Внимание: оплата по этой статье не отмечена. Статья сразу появится в открытом архиве.") : s === "accepted" ? "Автор получит уведомление. Затем отправьте ему реквизиты для оплаты в чате справа." : "Автор получит уведомление."))) return;
      b.disabled = true;
      const upd = { status: s, admin_note: $("#note").value };
      if (s === "published" && (!a.thumb_url || !a.pages)) {
        toast("Готовлю обложку из PDF…");
        const th = await makeThumb(a);
        if (th?.thumb_url) upd.thumb_url = th.thumb_url;
        if (th?.pages && !a.pages) upd.pages = th.pages;
      }
      let r = await sb.from("articles").update(upd).eq("id", a.id);
      if (r.error && (upd.thumb_url || upd.pages)) { delete upd.thumb_url; delete upd.pages; r = await sb.from("articles").update(upd).eq("id", a.id); }
      if (r.error) { b.disabled = false; return toast(r.error.message); }
      dropIndex();
      if (s === "published") { const rc = b.getBoundingClientRect(); confetti(rc.left + rc.width / 2, rc.top, 150); }
      toast({ accepted: "Статья одобрена. Отправьте автору реквизиты в чате", published: "Статья опубликована", revision: "Отправлено автору на доработку", rejected: "Статья отклонена", pending: "Статья снова на проверке" }[s]);
      counts(); setTimeout(() => detail(a.id), 500);
    });
    $("#paid").onchange = async e => {
      const { error } = await sb.from("articles").update({ paid: e.target.checked }).eq("id", a.id);
      if (error) { toast(error.message); e.target.checked = !e.target.checked; return; }
      toast(e.target.checked ? "Оплата отмечена, автор получил уведомление" : "Отметка об оплате снята");
    };
    $("#feat").onchange = async e => {
      const { error } = await sb.from("articles").update({ featured: e.target.checked }).eq("id", a.id);
      if (error) { toast(error.message); e.target.checked = !e.target.checked; return; }
      dropIndex(); toast(e.target.checked ? "Статья будет на главной как «Выбор редакции»" : "Убрано с главной");
    };
    const tb = $("#thumbBtn");
    if (tb) tb.onclick = async () => {
      tb.disabled = true; tb.textContent = "Готовлю…";
      const th = await makeThumb(a);
      if (th?.thumb_url) { await sb.from("articles").update({ thumb_url: th.thumb_url, ...(th.pages ? { pages: th.pages } : {}) }).eq("id", a.id); dropIndex(); toast("Обложка обновлена"); }
      else toast("Не удалось сделать обложку");
      tb.disabled = false; tb.textContent = "Обновить обложку из PDF";
    };
    $("#del").onclick = async () => {
      if (!(await confirmBox("Удалить статью навсегда?", "Статья, ее файл и переписка будут удалены без возможности восстановления.", "Удалить"))) return;
      if (a.pdf_path) await sb.storage.from("papers").remove([a.pdf_path]);
      const { error } = await sb.from("articles").delete().eq("id", a.id);
      if (error) return toast(error.message);
      dropIndex(); toast("Статья удалена"); go("queue");
    };
  }

  function upload() {
    $("#view").innerHTML = `<div class="panel"><h2>Статья в архив</h2><p class="muted">Готовая статья сразу попадает в открытый архив, без проверки. Обложка и число страниц берутся из PDF автоматически.</p><form id="uf">
      <label>Название</label><input name="title" required>
      <label>Авторы <small>(ФИО, степень, организация; соавторов через точку с запятой)</small></label><input name="authors" required>
      <div class="row2"><div><label>Направление</label><select name="category">${RUBRIC_NAMES.map(r => `<option>${esc(r)}</option>`).join("")}</select></div>
      <div><label>Язык</label><select name="lang">${Object.entries(LANGS).map(([k, v]) => `<option value="${k}">${v}</option>`).join("")}</select></div></div>
      <label>Аннотация</label><textarea name="abstract"></textarea>
      <label>Ключевые слова</label><input name="keywords">
      <div class="row2"><div><label>Дата публикации</label><input type="date" name="date" value="${new Date().toISOString().slice(0, 10)}"></div>
      <div><label>Статус</label><select name="status"><option value="published">Сразу опубликовать</option><option value="pending">Положить в заявки</option></select></div></div>
      <label>PDF</label><input type="file" id="upPdf" accept="application/pdf,.pdf" required>
      <input type="file" id="bulkPdf" accept="application/pdf,.pdf" multiple class="hidden">
      <button class="btn red" style="margin-top:20px" id="upBtn">Добавить статью</button></form></div>`;
    $("#uf").onsubmit = async e => {
      e.preventDefault();
      const fd = Object.fromEntries(new FormData(e.target));
      const btn = $("#upBtn"); btn.disabled = true; btn.textContent = "Загружаю…";
      try {
        const id = await addArticle({ ...fd, published_at: new Date(fd.date).toISOString() }, $("#upPdf").files[0]);
        toast("Статья добавлена"); go("detail", id);
      } catch (err) { toast(err.message); btn.disabled = false; btn.textContent = "Добавить статью"; }
    };
  }
  async function addArticle(m, file) {
    const pdf_path = await uploadPaper(file, ME.user.id);
    const row = { author_id: ME.user.id, title: m.title, authors: m.authors, category: m.category, lang: m.lang || "ru", abstract: m.abstract || "", keywords: m.keywords || "", pdf_path, status: m.status || "published" };
    if (row.status === "published") row.published_at = m.published_at || new Date().toISOString();
    const { data, error } = await sb.from("articles").insert(row).select("*").single();
    if (error) throw error;
    const th = await makeThumb(data);
    if (th) await sb.from("articles").update({ ...(th.thumb_url ? { thumb_url: th.thumb_url } : {}), ...(th.pages ? { pages: th.pages } : {}) }).eq("id", data.id);
    dropIndex();
    return data.id;
  }
  window.bulkImport = async metas => {
    const files = [...$("#bulkPdf").files];
    const out = [];
    for (const m of metas) {
      const f = files.find(x => x.name === m.file);
      if (!f) { out.push([m.file, "нет файла"]); continue; }
      try { out.push([m.file, await addArticle(m, f)]); } catch (err) { out.push([m.file, "ошибка: " + err.message]); }
    }
    return out;
  };

  async function news() {
    const { data } = await sb.from("news").select("*").order("created_at", { ascending: false });
    $("#view").innerHTML = `<div class="panel"><div class="detail-head"><h2>Новости и интересное</h2><button class="btn red sm" id="addN">+ Добавить</button></div>
      <div class="tbl-wrap"><table class="t" style="margin-top:14px"><tr><th>Заголовок</th><th>Раздел</th><th>Дата</th><th></th></tr>
      ${(data || []).map(n => `<tr><td><a href="news-item.html?id=${n.id}">${esc(n.title)}</a>${n.published ? "" : " <span class='badge b-pending'>черновик</span>"}</td><td>${n.kind === "news" ? "Новости" : "Интересное"}</td><td>${fmtDate(n.created_at)}</td>
        <td style="white-space:nowrap"><button class="btn ghost sm" data-e="${n.id}">Изменить</button> <button class="btn ghost sm" data-d="${n.id}">Удалить</button></td></tr>`).join("") || `<tr><td colspan="4" class="muted">Пока пусто</td></tr>`}</table></div></div>`;
    $("#addN").onclick = () => editNews({});
    $$("[data-e]").forEach(b => b.onclick = () => editNews(data.find(n => n.id == b.dataset.e)));
    $$("[data-d]").forEach(b => b.onclick = async () => { if (!(await confirmBox("Удалить запись?", "Действие нельзя отменить.", "Удалить"))) return; await sb.from("news").delete().eq("id", b.dataset.d); dropIndex(); news(); });
  }
  function editNews(n) {
    const m = modal(`<h3>${n.id ? "Изменить запись" : "Новая запись"}</h3><form id="nf">
      <div class="row2"><div><label>Раздел</label><select name="kind"><option value="news" ${n.kind !== "interesting" ? "selected" : ""}>Новости</option><option value="interesting" ${n.kind === "interesting" ? "selected" : ""}>Интересное</option></select></div>
      <div><label>Статус</label><select name="published"><option value="true">Опубликовано</option><option value="false" ${n.published === false ? "selected" : ""}>Черновик</option></select></div></div>
      <label>Заголовок</label><input name="title" required value="${esc(n.title)}">
      <label>Кратко <small>(1–2 предложения для карточки)</small></label><input name="summary" value="${esc(n.summary)}">
      <label>Текст <small>(абзацы через пустую строку; «## » — подзаголовок, «> » — цитата, «- » — список)</small></label><textarea name="body" style="min-height:240px">${esc(n.body)}</textarea>
      <div class="row2"><div><label>Автор</label><input name="author" value="${esc(n.author || ME.profile.full_name || "")}"></div>
      <div><label>Обложка <small>(по желанию)</small></label><input type="file" id="cov" accept="image/*"></div></div>
      <div class="actions"><button class="btn red">Сохранить</button></div></form>`);
    $("#nf", m.el).onsubmit = async e => {
      e.preventDefault();
      const fd = Object.fromEntries(new FormData(e.target));
      const row = { kind: fd.kind, published: fd.published === "true", title: fd.title, summary: fd.summary, body: fd.body, author: fd.author };
      const f = $("#cov", m.el).files[0];
      if (f) {
        const path = "news/" + safeName(f.name);
        const { error } = await sb.storage.from("covers").upload(path, f, { contentType: f.type });
        if (error) return toast(error.message);
        row.cover_url = sb.storage.from("covers").getPublicUrl(path).data.publicUrl;
      }
      let r = n.id ? await sb.from("news").update(row).eq("id", n.id) : await sb.from("news").insert(row);
      if (r.error && row.author !== undefined) { delete row.author; r = n.id ? await sb.from("news").update(row).eq("id", n.id) : await sb.from("news").insert(row); }
      if (r.error) return toast(r.error.message);
      m.close(); dropIndex(); toast("Сохранено"); news();
    };
  }

  async function authors() {
    $("#view").innerHTML = `<div class="panel">Загрузка…</div>`;
    const [r, st] = await Promise.all([sb.rpc("admin_people"), sb.rpc("admin_user_stats")]);
    const ps = r.data || [], S = st.data || {};
    const days = S.by_day || [], mx = Math.max(1, ...days.map(d => d.n));
    $("#view").innerHTML = `<div class="panel"><div class="detail-head"><h2>Пользователи</h2><button class="btn ghost sm" id="csv">Скачать CSV</button></div>
      <div class="kpis u-kpis">
        <div class="kpi"><b>${num(S.total || ps.length)}</b><span>всего аккаунтов</span></div>
        <div class="kpi"><b>${num(S.d1 || 0)}</b><span>за сутки</span></div>
        <div class="kpi"><b>${num(S.d7 || 0)}</b><span>за 7 дней</span></div>
        <div class="kpi"><b>${num(S.d30 || 0)}</b><span>за 30 дней</span></div>
        <div class="kpi"><b>${num(S.authors || 0)}</b><span>подавали статьи</span></div>
        <div class="kpi"><b>${num(S.public || 0)}</b><span>открытых профилей</span></div>
      </div>
      <h3 class="pf-h">Регистрации за 30 дней</h3>
      <div class="ubars">${days.map(d => `<div class="ubar" title="${fmtShort(d.d)}: ${d.n}"><i style="height:${Math.max(3, d.n / mx * 100)}%"></i>${d.n ? `<b>${d.n}</b>` : ""}</div>`).join("")}</div>
      <div class="ubar-axis mono"><span>${days[0] ? fmtShort(days[0].d) : ""}</span><span>сегодня</span></div>
      <div class="u-tools"><input id="uq" placeholder="Поиск по имени, email, организации…"><select id="uf"><option value="">Все</option><option value="authors">Подавали статьи</option><option value="public">Открытый профиль</option><option value="new">Новые за 7 дней</option></select></div>
      <div class="tbl-wrap"><table class="t u-t"><thead><tr><th></th><th>Пользователь</th><th>Контакты</th><th>Организация</th><th>Статьи</th><th>Регистрация</th><th></th></tr></thead><tbody id="ub"></tbody></table></div></div>`;
    const paint = () => {
      const q = norm($("#uq").value), f = $("#uf").value, wk = Date.now() - 7 * 864e5;
      const list = ps.filter(p => (!q || norm([p.full_name, p.email, p.organization, p.phone, p.specialization].join(" ")).includes(q))
        && (f !== "authors" || p.total > 0) && (f !== "public" || p.is_public) && (f !== "new" || new Date(p.created_at) > wk));
      $("#ub").innerHTML = list.map(p => `<tr data-u="${p.id}"><td>${avatarHTML(p, "sm")}</td>
        <td><b>${esc(p.full_name || "—")}</b>${p.is_admin ? " <span class='badge b-published'>редакция</span>" : ""}${p.is_public ? " <span class='badge b-revision'>профиль открыт</span>" : ""}<br><span class="muted small">${esc([p.specialization, p.degree, p.position].filter(Boolean).join(", "))}</span></td>
        <td>${esc(p.email || "")}<br><span class="muted">${esc(p.phone || "")}</span></td><td>${esc(p.organization || "")}</td>
        <td>${p.total} / ${p.published} опубл.</td><td>${fmtDate(p.created_at)}</td>
        <td><button class="btn ghost sm" data-w="${p.id}">Написать</button></td></tr>`).join("") || `<tr><td colspan="7" class="muted">Никого не нашли</td></tr>`;
      $$("#ub tr[data-u]").forEach(tr => tr.onclick = e => go("user", tr.dataset.u + (e.target.closest("[data-w]") ? "&w" : "")));
    };
    $("#uq").oninput = debounce(paint, 150); $("#uf").onchange = paint; paint();
    $("#csv").onclick = () => {
      const head = ["ФИО", "Email", "Телефон", "Специализация", "Степень", "Должность", "Организация", "Профиль открыт", "Статей", "Опубликовано", "Регистрация"];
      const lines = [head, ...ps.map(p => [p.full_name, p.email, p.phone, p.specialization, p.degree, p.position, p.organization, p.is_public ? "да" : "нет", p.total, p.published, fmtDate(p.created_at)])]
        .map(r => r.map(v => `"${String(v ?? "").replace(/"/g, '""')}"`).join(";")).join("\r\n");
      const blob = new Blob(["\ufeff" + lines], { type: "text/csv;charset=utf-8" });
      const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "lawart-users.csv"; a.click();
    };
  }

  async function user(arg) {
    const [uid, w] = String(arg).split("&");
    $("#view").innerHTML = `<div class="panel">Загрузка…</div>`;
    const [{ data: p }, { data: arts }] = await Promise.all([sb.rpc("admin_person", { p_id: uid }),
      sb.from("articles").select("id,title,status,created_at").eq("author_id", uid).order("created_at", { ascending: false })]);
    if (!p) { $("#view").innerHTML = `<div class="panel">Пользователь не найден</div>`; return; }
    const exp = Array.isArray(p.experience) ? p.experience : [], gal = Array.isArray(p.gallery) ? p.gallery : [];
    $("#view").innerHTML = `<div class="adm-grid">
      <div class="panel"><button class="btn ghost sm" id="back">← Все пользователи</button>
        <div class="u-head">${avatarHTML(p, "xl")}<div><h2>${esc(p.full_name || "Без имени")}</h2><p class="muted">${esc([p.specialization, p.degree, p.position, p.organization, p.city].filter(Boolean).join(" · "))}</p>
          <div class="actions">${p.is_public ? `<a class="btn ghost sm" href="profile.html?id=${p.id}" target="_blank">Публичный профиль</a>` : `<span class="badge b-pending">профиль скрыт</span>`}</div></div></div>
        <dl class="u-dl"><dt>Email входа</dt><dd><a href="mailto:${esc(p.email)}">${esc(p.email)}</a></dd>
          ${p.contact_email ? `<dt>Email для связи</dt><dd>${esc(p.contact_email)}</dd>` : ""}
          ${p.phone ? `<dt>Телефон</dt><dd><a href="tel:${esc(p.phone)}">${esc(p.phone)}</a></dd>` : ""}
          ${p.telegram ? `<dt>Telegram</dt><dd><a href="https://t.me/${esc(p.telegram.replace(/^@/, ""))}" target="_blank">${esc(p.telegram)}</a></dd>` : ""}
          ${p.orcid ? `<dt>ORCID</dt><dd>${esc(p.orcid)}</dd>` : ""}
          <dt>Регистрация</dt><dd>${fmtDate(p.created_at)}</dd></dl>
        ${p.bio ? `<h3 class="pf-h">О себе</h3><p>${esc(p.bio)}</p>` : ""}
        ${exp.length ? `<h3 class="pf-h">Опыт</h3><ol class="tl">${exp.map(x => `<li><span class="tl-dot"></span><small class="mono">${esc(x.period || "")}</small><b>${esc(x.role || "")}</b><span>${esc(x.org || "")}</span></li>`).join("")}</ol>` : ""}
        ${gal.length ? `<h3 class="pf-h">Фото</h3><div class="pp-gal sm">${gal.map((u, i) => `<button class="pp-g" data-i="${i}" style="background-image:url('${esc(u)}')"></button>`).join("")}</div>` : ""}
        <h3 class="pf-h">Статьи</h3>${arts && arts.length ? arts.map(a => `<p><a href="admin.html?a=${a.id}">№${pad(a.id)} ${esc(a.title)}</a> ${badge(a.status)}</p>`).join("") : `<p class="muted">Статей пока нет</p>`}
      </div>
      <div class="adm-chat" id="uChat"></div></div>`;
    $("#back").onclick = () => go("authors");
    $$(".pp-g").forEach(b => b.onclick = () => lightbox(gal, +b.dataset.i));
    stopChat = mountChat($("#uChat"), {}, { dm: p.id, peer: p.full_name || p.email, focus: !!w, onSend: counts });
    setTimeout(counts, 1500);
  }

  const startId = qs("a"), h = location.hash.slice(1);
  if (qs("u")) go("user", qs("u")); else if (startId) go("detail", startId, qs("chat") ? "&chat=1" : ""); else if (V[h] && h !== "detail") go(h); else go("queue");
})();
</script>
</body>
</html>
