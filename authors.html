<body>
<main>
  <section class="page-hero night">
    <div class="wrap">
      <span class="kicker"><i></i><span data-t="au.kicker"></span></span>
      <h1 data-t="au.title"></h1>
      <div class="actions" style="margin-top:26px"><a class="btn gold magnetic" href="cabinet.html#new" data-t="au.cta"></a></div>
    </div>
    <div class="ph-mark">✎</div>
  </section>
  <div class="wrap" style="padding:56px 28px 100px">
    <div class="req-grid">
      <div class="req tilt reveal"><div class="n">I</div><h4 data-t="au.s1t"></h4><p data-t="au.s1p"></p><span class="glare"></span></div>
      <div class="req tilt reveal"><div class="n">II</div><h4 data-t="au.s2t"></h4><p data-t="au.s2p"></p><span class="glare"></span></div>

      <div class="req tilt reveal"><div class="n">IV</div><h4 data-t="au.s4t"></h4><p data-t="au.s4p"></p><span class="glare"></span></div>
    </div>
    <div class="two">
      <div class="panel reveal"><h2 data-t="au.structT"></h2><ol data-t="au.struct"></ol></div>
      <div class="panel reveal"><h2 data-t="au.reviewT"></h2><p data-t="au.review1"></p><p data-t="au.review2"></p><p data-t="au.review3"></p>
        <a class="btn red magnetic" href="cabinet.html#new" data-t="au.cta"></a></div>
    </div>
    <div class="panel reveal" id="ourAuthors" style="margin-top:26px;display:none"><div class="detail-head"><h2 data-t="pp.ours"></h2></div><div class="au-grid" id="auGrid"></div></div>
    <div class="panel reveal faq" style="margin-top:26px">
      <h2 data-t="au.faqT"></h2>
      <details open><summary data-t="au.q1"></summary><p data-t="au.a1"></p></details>
      <details><summary data-t="au.q2"></summary><p data-t="au.a2"></p></details>
      <details><summary data-t="au.q3"></summary><p data-t="au.a3"></p></details>
      <details><summary data-t="au.q4"></summary><p data-t="au.a4"></p></details>
      <details><summary data-t="au.q5"></summary><p data-t="au.a5"></p></details>
    </div>
  </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>(async () => {
  await boot("authors", { overlay: true }); bindFx();
  const { data } = await sb.rpc("public_authors");
  if (data && data.length) {
    $("#auGrid").innerHTML = data.map(p => `<a class="au-tile tilt" href="profile.html?id=${p.id}">${avatarHTML(p, "lg")}<b>${esc(p.full_name)}</b><span>${esc(p.specialization || p.organization || "")}</span><small class="mono">${num(p.published)} ${tn("stat.articles", p.published)}</small><span class="glare"></span></a>`).join("");
    $("#ourAuthors").style.display = ""; bindFx($("#ourAuthors"));
  }
})();</script>
