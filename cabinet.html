<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Кабинет автора — Lawart</title>
<meta name="description" content="Lawart.uz — электронный научный журнал юридических статей Узбекистана. Научные статьи по праву в PDF, публикация статей для студентов, магистрантов и юристов. Huquqiy ilmiy maqolalar jurnali.">
<meta name="keywords" content="Lawart, юридический журнал, научные статьи по праву, публикация статей Узбекистан, право Узбекистана, huquqiy maqolalar, ilmiy jurnal, ТГЮУ">
<meta name="robots" content="index,follow,max-image-preview:large">
<meta property="og:image" content="https://lawart.uz/assets/og.png">
<meta property="og:locale" content="ru_RU">
<meta property="og:title" content="Кабинет автора — Lawart">
<meta property="og:description" content="Научный журнал, где право становится искусством аргумента.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Lawart">
<meta name="theme-color" content="#0b0c10">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<script>try{var th=localStorage.getItem('lawart-theme');if(th)document.documentElement.dataset.theme=th;var lg=localStorage.getItem('lawart-lang');if(lg)document.documentElement.lang=lg}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://xgwzpygoewtfeexraats.supabase.co">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500;1,600&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css?v=20261120f">
</head>
<body>
<main class="wrap dash">
  <aside class="side-nav">
    <div class="me"><span class="kicker" data-t="cb.kicker"></span><b id="meName"></b><span id="meOrg"></span></div>
    <button data-v="list" class="on"><span data-t="cb.my"></span><span class="cnt hidden" id="cntUnread"></span></button>
    <button data-v="new"><span>+ <span data-t="cb.new"></span></span></button>
    <button data-v="profile"><span data-t="cb.profile"></span></button>
    <button data-v="messages"><span data-t="dm.nav"></span><span class="cnt hidden" id="cntDm"></span></button>
    <button data-v="password"><span data-t="cb.password"></span></button>
    <button id="logout"><span data-t="cb.logout"></span></button>
  </aside>
  <section id="view"></section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/key.js"></script>
<script src="assets/config.js?v=20261120f"></script>
<script src="assets/i18n.js?v=20261120f"></script>
<script src="assets/offer.js?v=20261120f"></script>
<script src="assets/app.js?v=20261120f"></script>
<script>
(async () => {
  if (!(await requireAuth())) return;
  await boot("", { noBook: true });
  const P = ME.profile || {};
  $("#meName").textContent = P.full_name || ME.user.email;
  $("#meOrg").textContent = [P.degree, P.organization].filter(Boolean).join(", ");
  $("#logout").onclick = async () => { await sb.auth.signOut(); };
  let stopChat = null;
  $$(".side-nav [data-v]").forEach(b => b.onclick = () => go(b.dataset.v));
  const VIEWS = { list, new: form, profile, password, detail, messages };
  async function dmCount() {
    const { count } = await sb.from("dm").select("id", { count: "exact", head: true }).eq("user_id", ME.user.id).neq("sender_id", ME.user.id).is("read_at", null);
    $("#cntDm").textContent = count || 0; $("#cntDm").classList.toggle("hidden", !count);
  }
  dmCount(); setInterval(dmCount, 15000);

  function go(v, id) {
    if (stopChat) { stopChat(); stopChat = null; }
    $$(".side-nav [data-v]").forEach(b => b.classList.toggle("on", b.dataset.v === (v === "detail" ? "list" : v)));
    history.replaceState(null, "", "cabinet.html" + (id ? "?a=" + id : "") + (v !== "list" && v !== "detail" ? "#" + v : ""));
    VIEWS[v](id);
    scrollTo({ top: 0, behavior: "smooth" });
  }

  function stepper(st) {
    const order = ["s1", "s2", "s3", "s4"];
    const reached = { pending: 2, revision: 3, accepted: 3, published: 4, rejected: 3 }[st] || 1;
    let html = "";
    order.forEach((k, i) => {
      const n = i + 1;
      let cls = n < reached ? "done" : n === reached ? "now" : "";
      if (st === "published" && n === 4) cls = "done";
      if (st === "rejected" && n === 3) cls = "bad";
      if (st === "revision" && n === 3) cls = "now";
      html += `<div class="s ${cls}"><i>${cls === "done" ? "✓" : cls === "bad" ? "×" : n}</i><span>${t("cb." + k)}</span></div>`;
      if (n < 4) html += `<div class="bar ${n < reached || (st === "published") ? "done" : ""}"></div>`;
    });
    return `<div class="stepper">${html}</div>`;
  }

  async function list() {
    $("#view").innerHTML = `<div class="panel"><h2>${t("cb.my")}</h2><p class="muted">${t("cb.myHint")}</p><div class="sub-list" id="subs">${t("c.loading")}</div></div>`;
    const { data } = await sb.from("articles").select("id,title,category,status,created_at,updated_at").eq("author_id", ME.user.id).order("created_at", { ascending: false });
    const { data: notif } = await sb.from("notifications").select("link").eq("is_read", false);
    const unreadFor = new Set((notif || []).map(n => n.link));
    const nUnread = (data || []).filter(a => unreadFor.has("cabinet.html?a=" + a.id)).length;
    $("#cntUnread").textContent = nUnread; $("#cntUnread").classList.toggle("hidden", !nUnread);
    $("#subs").innerHTML = data?.length ? data.map(a => `<div class="sub" data-id="${a.id}">
        <div><h4>${esc(a.title)} ${unreadFor.has("cabinet.html?a=" + a.id) ? `<span class="badge b-revision">${t("cb.newBadge")}</span>` : ""}</h4><span class="muted" style="font-size:.86rem">№${pad(a.id)} · ${esc(rubricName(a.category))} · ${t("cb.submittedOn")} ${fmtDate(a.created_at)}</span></div>
        ${badge(a.status)}</div>`).join("")
      : `<div class="empty-state"><div class="es-ic">§</div><b>${t("cb.empty")}</b><br><button class="btn red" id="first">${t("cb.emptyBtn")}</button></div>`;
    $$("#subs .sub").forEach(s => s.onclick = () => go("detail", s.dataset.id));
    const f = $("#first"); if (f) f.onclick = () => go("new");
  }

  const rubricOptions = sel => RUBRIC_NAMES.map(r => `<option value="${esc(r)}" ${r === sel ? "selected" : ""}>${esc(rubricName(r))}</option>`).join("");
  const langOptions = sel => Object.entries(LANGS).map(([k, v]) => `<option value="${k}" ${k === sel ? "selected" : ""}>${v}</option>`).join("");

  function offerGate() {
    const O = offerT();
    $("#view").innerHTML = `<div class="panel of-gate"><span class="kicker"><i></i>${esc(O.title)}</span><h2>${esc(O.gateT)}</h2><p class="muted">${esc(O.gateP)}</p>
      <div class="of-short">${O.short.map(([h, p], i) => `<div class="of-card"><span class="mono">0${i + 1}</span><b>${esc(h)}</b><p>${esc(p)}</p></div>`).join("")}</div>
      <details class="of-details"><summary>${esc(O.full)}</summary><div class="of-body">${O.body}</div></details>
      <label class="of-check"><input type="checkbox" id="ofOk"><span>${esc(O.agree)}</span></label>
      <button class="btn red magnetic" id="ofBtn" disabled>${esc(O.accept)} ${ICON.arrow}</button></div>`;
    $("#ofOk").onchange = e => { $("#ofBtn").disabled = !e.target.checked; };
    $("#ofBtn").onclick = async () => {
      $("#ofBtn").disabled = true;
      const { error } = await sb.from("profiles").update({ offer_accepted_at: new Date().toISOString(), offer_version: OFFER_VERSION }).eq("id", ME.user.id);
      if (error) { $("#ofBtn").disabled = false; return toast(error.message); }
      await loadMe(); Object.assign(P, ME.profile || {});
      toast(O.accepted); form();
    };
    bindFx($("#view"));
  }

  function form() {
    if (!P.offer_accepted_at || P.offer_version !== OFFER_VERSION) return offerGate();
    const draft = store.get("lawart-draft", null);
    const d = draft || {};
    $("#view").innerHTML = `<div class="panel"><h2>${t("cb.newTitle")}</h2><p class="muted">${t("cb.newHint")}</p>
      ${draft ? `<div class="note" style="background:color-mix(in srgb,var(--gold) 12%,var(--card));border-color:var(--gold)">✎ ${t("cb.draftRestored")}</div>` : ""}
      <form id="nf">
        <label>${t("cb.fTitle")}</label><input name="title" required maxlength="300" value="${esc(d.title || "")}">
        <label>${t("cb.fAuthors")} <small>${t("cb.fAuthorsHint")}</small></label>
        <input name="authors" required value="${esc(d.authors || [P.full_name, P.degree, P.organization].filter(Boolean).join(", "))}">
        <div class="row2">
          <div><label>${t("cb.fRubric")}</label><select name="category" required>${rubricOptions(d.category)}</select></div>
          <div><label>${t("cb.fLang")}</label><select name="lang">${langOptions(d.lang || LANG)}</select></div>
        </div>
        <label>${t("cb.fAbstract")} <small>${t("cb.fAbstractHint")}</small></label><textarea name="abstract" required>${esc(d.abstract || "")}</textarea>
        <div class="hint" id="wc"></div>
        <label>${t("cb.fKeywords")} <small>${t("cb.fKeywordsHint")}</small></label><input name="keywords" placeholder="${esc(t("cb.fKeywordsPh"))}" value="${esc(d.keywords || "")}">
        <label>${t("cb.fFile")} <small>${t("cb.fFileHint")}</small></label>
        <div class="dropzone" id="dz"><div class="dz-ic">§</div><b>${t("cb.drop")}</b><span class="muted">${t("cb.dropSub")}</span><input type="file" id="pdf" accept="application/pdf,.pdf" class="hidden"><div id="fileName" class="ok"></div></div>
        <label style="display:flex;gap:10px;align-items:flex-start;font-weight:500;margin-top:20px"><input type="checkbox" required style="margin-top:4px"> ${t("cb.fConfirm")}</label>
        <div id="nmsg"></div>
        <div class="actions"><button class="btn red magnetic" id="send">${t("cb.send")} ${ICON.arrow}</button><span class="hint" style="align-self:center">✎ ${t("cb.draftSaved")}</span></div>
        <p class="hint of-note">${esc(offerT().formNote)} <a href="offer.html" target="_blank" rel="noopener">${esc(offerT().formLink)}</a>.</p>
      </form></div>`;
    const dz = $("#dz"), inp = $("#pdf"), f = $("#nf");
    let pages = 0;
    const wc = () => { const n = (f.abstract.value.trim().match(/\S+/g) || []).length; $("#wc").textContent = n ? `${n} ${t("cb.words")}` : ""; };
    wc();
    f.addEventListener("input", debounce(() => {
      const fd = Object.fromEntries(new FormData(f)); delete fd.file;
      store.set("lawart-draft", { title: fd.title, authors: fd.authors, category: fd.category, lang: fd.lang, abstract: fd.abstract, keywords: fd.keywords });
      wc();
    }, 400));
    dz.onclick = e => { if (e.target !== inp) inp.click(); };
    dz.ondragover = e => { e.preventDefault(); dz.classList.add("over"); };
    dz.ondragleave = () => dz.classList.remove("over");
    dz.ondrop = e => { e.preventDefault(); dz.classList.remove("over"); inp.files = e.dataTransfer.files; inp.onchange(); };
    inp.onchange = async () => {
      const file = inp.files[0];
      dz.classList.toggle("has", !!file);
      $("#fileName").textContent = file ? `✓ ${file.name} · ${fileSize(file.size)}` : "";
      pages = 0;
      if (file) { try { const info = await pdfInfo(file, false); pages = info.pages; $("#fileName").textContent += ` · ${pages} ${t("cb.pagesFound")}`; } catch (e) { } }
    };
    f.onsubmit = async e => {
      e.preventDefault();
      const fd = Object.fromEntries(new FormData(f));
      const file = inp.files[0];
      if (!fd.title.trim() || !fd.authors.trim() || !fd.abstract.trim()) { f.reportValidity(); return; }
      if (!file) { $("#nmsg").innerHTML = `<div class="err">${t("cb.needPdf")}</div>`; dz.scrollIntoView({ behavior: "smooth", block: "center" }); return; }
      if (!f.querySelector("[type=checkbox]").checked) { f.reportValidity(); return; }
      const btn = $("#send"); btn.disabled = true; btn.textContent = t("cb.uploading");
      try {
        const pdf_path = await uploadPaper(file, ME.user.id);
        const row = { author_id: ME.user.id, title: fd.title.trim(), authors: fd.authors.trim(), category: fd.category, lang: fd.lang, abstract: fd.abstract.trim(), keywords: fd.keywords.trim(), pdf_path };
        if (pages) row.pages = pages;
        let r = await sb.from("articles").insert(row).select("id").single();
        if (r.error && pages) { delete row.pages; r = await sb.from("articles").insert(row).select("id").single(); }
        if (r.error) throw r.error;
        store.set("lawart-draft", null); try { localStorage.removeItem("lawart-draft"); } catch (er) { }
        const b = btn.getBoundingClientRect(); confetti(b.left + b.width / 2, b.top, 160);
        toast(t("cb.sent"));
        setTimeout(() => go("detail", r.data.id), 700);
      } catch (err) { $("#nmsg").innerHTML = `<div class="err">${esc(err.message)}</div>`; btn.disabled = false; btn.innerHTML = t("cb.send") + " " + ICON.arrow; }
    };
    bindFx($("#view"));
  }

  async function detail(id) {
    const { data: a } = await sb.from("articles").select("*").eq("id", id).maybeSingle();
    if (!a) return list();
    readNotifFor("cabinet.html?a=" + id);
    const canEdit = ["pending", "revision"].includes(a.status);
    const url = await signedUrl("papers", a.pdf_path);
    $("#view").innerHTML = `<div class="panel">
      <button class="back" id="back">← ${t("cb.back")}</button>
      <div class="detail-head"><h2 style="max-width:640px">${esc(a.title)}</h2>${badge(a.status)}</div>
      ${stepper(a.status)}
      <p class="muted">${t("cb.h." + a.status)}</p>
      ${a.status === "accepted" && a.paid ? `<div class="note ok">${t("cb.paid")}</div>` : ""}
      ${a.admin_note ? `<div class="note"><b>${t("cb.note")}:</b><br>${esc(a.admin_note)}</div>` : ""}
      <div class="meta-grid"><div><small>${t("cb.mRubric")}</small>${esc(rubricName(a.category))}</div><div><small>${t("cb.mSubmitted")}</small>${fmtDate(a.created_at)}</div><div><small>${a.published_at ? t("cb.mPublished") : t("cb.mUpdated")}</small>${fmtDate(a.published_at || a.updated_at)}</div></div>
      <div class="actions">
        ${url ? `<a class="btn ghost sm" href="${url}" target="_blank" rel="noopener">${t("cb.openPdf")}</a>` : ""}
        ${a.status === "published" ? `<a class="btn green sm" href="article.html?id=${a.id}">${t("cb.page")}</a>` : ""}
        ${canEdit ? `<button class="btn sm" id="editBtn">${t("cb.edit")}</button>` : ""}
      </div>
      <div id="editBox"></div>
      <div id="chatBox"></div></div>`;
    $("#back").onclick = () => go("list");
    stopChat = mountChat($("#chatBox"), a, { focus: !!qs("chat") });
    if (canEdit) $("#editBtn").onclick = () => {
      $("#editBox").innerHTML = `<form id="ef" style="margin-top:18px;border-top:1px solid var(--line);padding-top:6px">
        <label>${t("cb.fTitle")}</label><input name="title" value="${esc(a.title)}" required>
        <label>${t("cb.fAuthors")}</label><input name="authors" value="${esc(a.authors)}" required>
        <div class="row2"><div><label>${t("cb.fRubric")}</label><select name="category">${rubricOptions(a.category)}</select></div><div><label>${t("cb.fLang")}</label><select name="lang">${langOptions(a.lang)}</select></div></div>
        <label>${t("cb.fAbstract")}</label><textarea name="abstract">${esc(a.abstract)}</textarea>
        <label>${t("cb.fKeywords")}</label><input name="keywords" value="${esc(a.keywords)}">
        <label>${t("cb.newPdf")} <small>${t("cb.newPdfHint")}</small></label><input type="file" id="newPdf" accept="application/pdf,.pdf">
        <button class="btn red" style="margin-top:16px">${a.status === "revision" ? t("cb.resend") : t("c.save")}</button></form>`;
      $("#ef").onsubmit = async e => {
        e.preventDefault();
        const fd = Object.fromEntries(new FormData(e.target));
        const upd = { title: fd.title, authors: fd.authors, category: fd.category, lang: fd.lang, abstract: fd.abstract, keywords: fd.keywords, status: "pending" };
        try {
          const f = $("#newPdf").files[0];
          if (f) { upd.pdf_path = await uploadPaper(f, ME.user.id); try { upd.pages = (await pdfInfo(f, false)).pages; } catch (er) { } }
          let r = await sb.from("articles").update(upd).eq("id", a.id);
          if (r.error && upd.pages) { delete upd.pages; r = await sb.from("articles").update(upd).eq("id", a.id); }
          if (r.error) throw r.error;
          toast(a.status === "revision" ? t("cb.resent") : t("c.saved"));
          detail(a.id);
        } catch (err) { toast(/решения редакции/.test(err.message) ? t("cb.editLocked") : err.message); }
      };
    };
  }

  function messages() {
    $("#view").innerHTML = `<div class="panel"><h2>${t("dm.title")}</h2><p class="muted">${t("dm.hint")}</p><div id="dmBox"></div></div>`;
    stopChat = mountChat($("#dmBox"), {}, { dm: ME.user.id, peer: t("ch.editorial"), focus: true, onSend: dmCount });
    setTimeout(dmCount, 1500);
  }

  function profile() {
    const exp = Array.isArray(P.experience) ? P.experience.slice() : [];
    let gallery = Array.isArray(P.gallery) ? P.gallery.slice() : [];
    let photo = P.photo_url || "";
    const pubUrl = "profile.html?id=" + ME.user.id;
    $("#view").innerHTML = (P.is_public ? `<div class="note ok pf-note">${t("cb.pubOk")} <a href="${pubUrl}" target="_blank">${t("pr.view")} →</a></div>` : `<div class="note pf-note">${t("cb.pubWarn")}</div>`) + `<div class="panel pf-panel"><div class="detail-head"><h2>${t("cb.pTitle")}</h2><a class="btn ghost sm" href="${pubUrl}" target="_blank" rel="noopener">${t("pr.view")}</a></div>
      <form id="pf">
      <div class="pf-top">
        <div class="pf-ava" id="avaBox" title="${t("pr.photo")}"><input type="file" id="avaIn" accept="image/*" class="hidden"><span id="avaImg"></span><button type="button" class="pf-ava-btn" id="avaBtn">${t("pr.changePhoto")}</button></div>
        <div class="pf-pub">
          <label class="switch-row"><span class="switch"><input type="checkbox" name="is_public" ${P.is_public ? "checked" : ""}><i></i></span><span><b>${t("pr.public")}</b><small>${t("pr.publicHint")}</small></span></label>
        </div>
      </div>
      <h3 class="pf-h">${t("pr.secMain")}</h3>
      <label>${t("cb.pName")}</label><input name="full_name" value="${esc(P.full_name)}" required>
      <div class="row2"><div><label>${t("pr.spec")}</label><input name="specialization" value="${esc(P.specialization)}" placeholder="${esc(t("pr.specPh"))}"></div><div><label>${t("pr.city")}</label><input name="city" value="${esc(P.city)}" placeholder="${esc(t("pr.cityPh"))}"></div></div>
      <div class="row2"><div><label>${t("cb.pDegree")}</label><input name="degree" value="${esc(P.degree)}"></div><div><label>${t("cb.pPosition")}</label><input name="position" value="${esc(P.position)}"></div></div>
      <label>${t("cb.pOrg")}</label><input name="organization" value="${esc(P.organization)}">
      <label>${t("pr.bio")}</label><textarea name="bio" rows="5" maxlength="2000" placeholder="${esc(t("pr.bioPh"))}">${esc(P.bio)}</textarea>
      <label>${t("cb.pOrcid")}</label><input name="orcid" value="${esc(P.orcid)}" placeholder="0000-0000-0000-0000">

      <h3 class="pf-h">${t("pr.secExp")}</h3><p class="muted">${t("pr.expHint")}</p>
      <div id="expList" class="exp-list"></div>
      <button type="button" class="btn ghost sm" id="expAdd">+ ${t("pr.expAdd")}</button>

      <h3 class="pf-h">${t("pr.secGal")}</h3><p class="muted">${t("pr.galHint")}</p>
      <div class="gal-edit" id="galEdit"></div><input type="file" id="galIn" accept="image/*" multiple class="hidden">

      <h3 class="pf-h">${t("pr.secContacts")}</h3><p class="muted">${t("pr.contactsHint")}</p>
      <div class="ct-row"><div><label>${t("pr.cEmail")}</label><input name="contact_email" type="email" value="${esc(P.contact_email || "")}" placeholder="${esc(ME.user.email)}"></div><label class="switch-row sm"><span class="switch"><input type="checkbox" name="show_email" ${P.show_email ? "checked" : ""}><i></i></span><span>${t("pr.show")}</span></label></div>
      <div class="ct-row"><div><label>${t("cb.pPhone")}</label><input name="phone" value="${esc(P.phone || "")}" placeholder="+998"></div><label class="switch-row sm"><span class="switch"><input type="checkbox" name="show_phone" ${P.show_phone ? "checked" : ""}><i></i></span><span>${t("pr.show")}</span></label></div>
      <div class="ct-row"><div><label>Telegram</label><input name="telegram" value="${esc(P.telegram || "")}" placeholder="@username"></div><label class="switch-row sm"><span class="switch"><input type="checkbox" name="show_telegram" ${P.show_telegram ? "checked" : ""}><i></i></span><span>${t("pr.show")}</span></label></div>
      <label>${t("pr.loginEmail")}</label><input value="${esc(ME.user.email)}" disabled>
      <div class="pf-save"><button class="btn red">${t("c.save")}</button></div></form></div>`;

    const paintAva = () => { $("#avaImg").innerHTML = avatarHTML({ full_name: P.full_name || ME.user.email, photo_url: photo }, "xl"); };
    paintAva();
    $("#avaBtn").onclick = () => $("#avaIn").click();
    $("#avaImg").onclick = () => $("#avaIn").click();
    $("#avaIn").onchange = async () => {
      const f = $("#avaIn").files[0]; if (!f) return;
      $("#avaBox").classList.add("busy");
      try { photo = await uploadPhoto(f, 640); paintAva(); toast(t("pr.photoReady")); } catch (e) { toast(e.message); }
      $("#avaBox").classList.remove("busy"); $("#avaIn").value = "";
    };

    const paintExp = () => {
      $("#expList").innerHTML = exp.map((x, i) => `<div class="exp-item" data-i="${i}">
        <input data-k="period" value="${esc(x.period || "")}" placeholder="${esc(t("pr.expPeriod"))}">
        <input data-k="role" value="${esc(x.role || "")}" placeholder="${esc(t("pr.expRole"))}">
        <input data-k="org" value="${esc(x.org || "")}" placeholder="${esc(t("pr.expOrg"))}">
        <button type="button" class="icon-btn sm" aria-label="×">×</button></div>`).join("") || `<p class="muted small">${t("pr.expEmpty")}</p>`;
      $$("#expList .exp-item").forEach(r => {
        const i = +r.dataset.i;
        $$("input", r).forEach(inp => inp.oninput = () => { exp[i][inp.dataset.k] = inp.value; });
        $("button", r).onclick = () => { exp.splice(i, 1); paintExp(); };
      });
    };
    paintExp();
    $("#expAdd").onclick = () => { if (exp.length >= 12) return; exp.push({ period: "", role: "", org: "" }); paintExp(); $$("#expList .exp-item input").slice(-3)[0]?.focus(); };

    const paintGal = () => {
      $("#galEdit").innerHTML = gallery.map((u, i) => `<div class="gal-th" style="background-image:url('${esc(u)}')"><button type="button" data-i="${i}" aria-label="×">×</button></div>`).join("")
        + (gallery.length < 8 ? `<button type="button" class="gal-add" id="galAdd"><b>+</b>${t("pr.galAdd")}</button>` : "");
      $$("#galEdit .gal-th button").forEach(b => b.onclick = () => { gallery.splice(+b.dataset.i, 1); paintGal(); });
      const ga = $("#galAdd"); if (ga) ga.onclick = () => $("#galIn").click();
    };
    paintGal();
    $("#galIn").onchange = async () => {
      const fs = [...$("#galIn").files].slice(0, 8 - gallery.length);
      if (!fs.length) return;
      const ga = $("#galAdd"); if (ga) ga.classList.add("busy");
      for (const f of fs) { try { gallery.push(await uploadPhoto(f, 1400)); } catch (e) { toast(e.message); } }
      $("#galIn").value = ""; paintGal();
    };

    $("#pf").onsubmit = async e => {
      e.preventDefault();
      const fd = Object.fromEntries(new FormData(e.target));
      const row = {
        full_name: fd.full_name.trim(), degree: fd.degree, position: fd.position, organization: fd.organization, orcid: fd.orcid,
        specialization: fd.specialization, city: fd.city, bio: fd.bio, phone: fd.phone, contact_email: fd.contact_email.trim(), telegram: fd.telegram.trim(),
        is_public: !!fd.is_public, show_email: !!fd.show_email, show_phone: !!fd.show_phone, show_telegram: !!fd.show_telegram,
        photo_url: photo, gallery, experience: exp.filter(x => (x.role || x.org || x.period || "").trim())
      };
      const btn = $(".pf-save .btn"); btn.disabled = true;
      const { error } = await sb.from("profiles").update(row).eq("id", ME.user.id);
      btn.disabled = false;
      if (error) return toast(error.message);
      await loadMe(); Object.assign(P, ME.profile || {}); $("#meName").textContent = P.full_name; paintUser();
      toast(row.is_public ? t("pr.savedPublic") : t("cb.pSaved"));
      if (row.is_public) confetti(innerWidth / 2, innerHeight / 3, 40);
    };
  }

  function password() {
    $("#view").innerHTML = `<div class="panel"><h2>${t("cb.pwTitle")}</h2><form id="pw" style="max-width:440px">
      <label>${t("cb.pw1")}</label><input type="password" name="p1" minlength="6" required autocomplete="new-password">
      <label>${t("cb.pw2")}</label><input type="password" name="p2" minlength="6" required autocomplete="new-password">
      <button class="btn red" style="margin-top:20px">${t("cb.pwBtn")}</button></form></div>`;
    $("#pw").onsubmit = async e => {
      e.preventDefault();
      const { p1, p2 } = Object.fromEntries(new FormData(e.target));
      if (p1 !== p2) return toast(t("cb.pwMismatch"));
      const { error } = await sb.auth.updateUser({ password: p1 });
      toast(error ? error.message : t("cb.pwDone"));
      if (!error) e.target.reset();
    };
  }

  const startId = qs("a"), hash = location.hash.slice(1);
  if (startId) go("detail", startId);
  else if (["new", "profile", "password", "messages"].includes(hash)) go(hash);
  else go("list");
  addEventListener("hashchange", () => { const h = location.hash.slice(1); if (["new", "profile", "password", "messages"].includes(h)) go(h); });
})();
</script>
</body>
</html>
