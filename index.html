  <section class="hero night spot" id="hero">
    <canvas id="hero3d" aria-hidden="true"></canvas>

    <div class="wrap hero-in">

          </div>

          <a class="btn ghost-light magnetic" href="articles.html" data-t="hero.cta2"></a>

      </div>
      <div class="cards" id="latestCards"></div>
    </div>
  </section>

  <section class="sec" id="rubrics" style="padding-top:20px">
    <div class="wrap">

        <div><span class="kicker"><i></i>I — XV</span><h2 data-t="sec.rubrics"></h2></div>

  <section class="maxim night">
    <div class="wrap">
      <span class="kicker"><i></i><span data-t="sec.maxim"></span><i></i></span>
      <div class="mx-latin" id="mxLatin"></div>
      <p class="mx-tr" id="mxTr"></p>
      <p class="mx-ex" id="mxEx"></p>
      <div class="mx-nav">
        <button type="button" id="mxPrev" data-ta="maxim.prev"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M19 12H5m6 6-6-6 6-6"/></svg></button>
        <span class="mono" id="mxNum"></span>
        <button type="button" id="mxSay" data-ta="maxim.listen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/></svg></button>
        <button type="button" id="mxNext" data-ta="maxim.next"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 12h14m-6-6 6 6-6 6"/></svg></button>
      </div>
    </div>
  </section>

  <section class="sec">
    <div class="wrap">
      <div class="sec-head reveal">
        <div><span class="kicker"><i></i>01 — 04</span><h2 data-t="sec.how"></h2></div>
        <a class="more" href="authors.html"><span data-t="sec.howLink"></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 12h14m-6-6 6 6-6 6"/></svg></a>
      </div>
      <div class="steps">
        <div class="step reveal"><div class="n">I</div><h4 data-t="step1.t"></h4><p data-t="step1.p"></p></div>
        <div class="step reveal"><div class="n">II</div><h4 data-t="step2.t"></h4><p data-t="step2.p"></p></div>
        <div class="step reveal"><div class="n">III</div><h4 data-t="step3.t"></h4><p data-t="step3.p"></p></div>
        <div class="step reveal"><div class="n">IV</div><h4 data-t="step4.t"></h4><p data-t="step4.p"></p></div>
      </div>
    </div>
  </section>

  <section class="sec" style="padding-top:0">
    <div class="wrap">
      <div class="editor reveal">
        <div class="ed-mono" id="edMono"></div>
        <div>
          <span class="kicker"><i></i><span data-t="sec.editor"></span></span>
          <blockquote style="margin-top:18px"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M9.6 6C6.5 7.3 4.5 10 4.5 13.6V18h6v-6H7.2c.2-2 1.4-3.5 3.3-4.4zm9 0c-3.1 1.3-5.1 4-5.1 7.6V18h6v-6h-3.3c.2-2 1.4-3.5 3.3-4.4z"/></svg><span data-t="editor.text"></span></blockquote>
          <div class="ed-sign"><i></i><b data-t="editor.name"></b><span data-t="editor.role"></span></div>
        </div>
      </div>
    </div>
  </section>

  <section class="sec" style="padding-top:0">
    <div class="wrap news-cols">
      <div>
        <div class="sec-head reveal" style="margin-bottom:14px">
          <div><span class="kicker"><i></i>Lawart</span><h2 data-t="sec.news"></h2></div>
          <a class="more" href="news.html"><span data-t="news.all"></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 12h14m-6-6 6 6-6 6"/></svg></a>
        </div>
        <div id="newsList"></div>
      </div>
      <div>
        <div class="interest reveal">
          <span class="mono" style="opacity:.75" data-t="int.rubric"></span>
          <h3 data-t="sec.interesting"></h3>
          <div id="interestList"></div>
          <a href="news.html?kind=interesting"><b data-t="int.all"></b></a>
        </div>
      </div>
    </div>
  </section>

  <section class="sec" style="padding-top:0">
    <div class="wrap">
      <div class="cta-band night reveal">
        <div class="cta-orb"></div>
        <div style="position:relative">
          <span class="kicker"><i></i><span data-t="cta.kicker"></span></span>
          <h2 data-t="cta.title"></h2>
        </div>
        <div style="position:relative">
          <p data-t="cta.text"></p>
          <a class="btn gold magnetic" href="auth.html?mode=signup&next=cabinet.html%23new"><span data-t="cta.btn"></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 12h14m-6-6 6 6-6 6"/></svg></a>
        </div>
      </div>
    </div>
  </section>
</main>
<script type="application/ld+json">{"@context":"https://schema.org","@graph":[{"@type":"WebSite","name":"Lawart","alternateName":"Lawart.uz — научный журнал юридических статей","url":"https://lawart.uz/","inLanguage":["ru","uz","en"],"potentialAction":{"@type":"SearchAction","target":"https://lawart.uz/articles.html?q={q}","query-input":"required name=q"}},{"@type":"Periodical","name":"Lawart","url":"https://lawart.uz/","description":"Электронный научный журнал юридических статей","publisher":{"@type":"Organization","name":"Lawart","url":"https://lawart.uz/"},"editor":{"@type":"Person","name":"Ходжиев Хасан Бекзод угли"}}]}</script>

<script src="assets/config.js?v=20261120f"></script>

<script>
(async () => {
  await boot("home", { overlay: true });

  $("#heroTitle").innerHTML = "Law".split("").map((c, i) => `<span class="ch" style="--i:${i}">${c}</span>`).join("") +
    `<i class="gold-text">${"art".split("").map((c, i) => `<span class="ch" style="--i:${i + 3}">${c}</span>`).join("")}</i>`;

  const shapeEl = $("#shapeName");
  const setShape = i => { shapeEl.style.opacity = 0; setTimeout(() => { shapeEl.textContent = t("hero.shape" + i); shapeEl.style.opacity = 1; }, 260); };
  import("./assets/hero3d.js?v=20261120f").then(m => {
    const h = m.initHero($("#hero3d"), { onShape: setShape });
    if (h) $("#shapeNext").onclick = () => h.next(); else $(".hero-shape").remove();
  }).catch(e => { console.warn(e); $(".hero-shape")?.remove(); });

  $("#mq").innerHTML = [...RUBRIC_NAMES, ...RUBRIC_NAMES].map(r => `<a href="articles.html?rubric=${encodeURIComponent(r)}">${esc(rubricName(r))}</a>`).join("");
  $("#edMono").innerHTML = initials(t("editor.name")).split("").join('<span style="color:var(--gold2);margin:0 2px">·</span>');

  // максима дня
  const day = Math.floor((Date.now() - new Date(new Date().getFullYear(), 0, 0)) / 864e5);
  let mi = day % MAXIMS.length;
  function showMaxim() {
    const m = maxim(mi);
    $("#mxLatin").innerHTML = m.latin.split(" ").map((w, i) => `<span class="w" style="--i:${i}">${esc(w)}</span>`).join(" ");
    $("#mxTr").textContent = "«" + m.tr + "»";
    $("#mxEx").textContent = m.ex;
    $("#mxNum").textContent = String(m.idx + 1).padStart(2, "0") + " / " + MAXIMS.length;
  }
  showMaxim();
  $("#mxPrev").onclick = () => { mi = (mi - 1 + MAXIMS.length) % MAXIMS.length; showMaxim(); };
  $("#mxNext").onclick = () => { mi = (mi + 1) % MAXIMS.length; showMaxim(); };
  if ("speechSynthesis" in window) {
    $("#mxSay").onclick = () => {
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(maxim(mi).latin);
      const v = speechSynthesis.getVoices().find(v => /^it/i.test(v.lang)) || speechSynthesis.getVoices().find(v => /^la/i.test(v.lang));
      if (v) u.voice = v; u.lang = v ? v.lang : "it-IT"; u.rate = .85;
      speechSynthesis.speak(u);
    };
  } else $("#mxSay").remove();

  // поиск в первом экране
  const hq = $("#heroQ"), hr = $("#heroRes");
  let idx = null, hsel = 0;
  async function heroSearch() {
    const q = hq.value.trim();
    if (!q) { hr.classList.add("hidden"); return; }
    idx = idx || await getIndex();
    const toks = tokens(q);
    const arts = searchArticles(idx.articles, q).slice(0, 6);
    const names = [...new Set(idx.articles.flatMap(a => authorNames(a.authors)))].filter(n => toks.every(tk => norm(n).includes(tk))).slice(0, 3);
    let html = arts.map(a => Palette.artItem(a, toks)).join("") +
      names.map(n => `<a class="pal-item" href="articles.html?author=${encodeURIComponent(n)}"><span class="pi-av">${esc(initials(n))}</span><span><b>${highlight(n, toks)}</b><small>${t("p.authorAll")}</small></span></a>`).join("");
    html = html || `<div class="pal-empty">${esc(t("p.nothing", { q }))}</div>`;
    html += `<a class="pal-item pal-all" href="articles.html?q=${encodeURIComponent(q)}"><span class="pi-ic">${ICON.search}</span><span><b>${t("p.showAll")}</b><small>${t("p.inCatalog")}</small></span></a>`;
    hr.innerHTML = html; hr.classList.remove("hidden"); hsel = 0; markHero();
  }
  function markHero() { $$(".pal-item", hr).forEach((x, i) => x.classList.toggle("on", i === hsel)); }
  hq.addEventListener("input", debounce(heroSearch, 80));
  hq.addEventListener("focus", heroSearch);
  hq.addEventListener("keydown", e => {
    const items = $$(".pal-item", hr);
    if (e.key === "ArrowDown") { e.preventDefault(); hsel = Math.min(items.length - 1, hsel + 1); markHero(); }
    else if (e.key === "ArrowUp") { e.preventDefault(); hsel = Math.max(0, hsel - 1); markHero(); }
    else if (e.key === "Enter") { e.preventDefault(); const it = items[hsel]; if (it && hq.value.trim()) it.click(); else if (hq.value.trim()) location.href = "articles.html?q=" + encodeURIComponent(hq.value.trim()); }
    else if (e.key === "Escape") hr.classList.add("hidden");
  });
  document.addEventListener("click", e => { if (!e.target.closest(".hero-search")) hr.classList.add("hidden"); });
  $("#heroGo").onclick = () => { const q = hq.value.trim(); location.href = "articles.html" + (q ? "?q=" + encodeURIComponent(q) : ""); };
  $$(".hs-tags [data-q]").forEach(a => a.onclick = e => { e.preventDefault(); hq.value = t(a.dataset.q); hq.focus(); heroSearch(); });

  // данные
  const { articles, news } = await getIndex();
  const authorsSet = new Set(articles.flatMap(a => authorNames(a.authors)));
  countUp($("#sA"), articles.length); countUp($("#sB"), authorsSet.size); countUp($("#sC"), RUBRICS.length);
  countUp($("#sD"), articles.reduce((s, a) => s + (a.views || 0), 0));

  const feat = articles.find(a => a.featured) || articles.slice().sort((a, b) => (b.views || 0) - (a.views || 0))[0];
  if (feat) {
    const abs = String(feat.abstract || "");
    $("#featured").innerHTML = `<div class="feature reveal">
      <a class="f-cover" href="article.html?id=${feat.id}">${coverHTML(feat, true)}</a>
      <div>
        <span class="kicker"><i></i>${t("sec.featured")}</span><br><br>
        <a class="tag-cat" href="articles.html?rubric=${encodeURIComponent(feat.category)}">${esc(rubricName(feat.category))}</a>
        <h3><a href="article.html?id=${feat.id}">${esc(feat.title)}</a></h3>
        <div class="f-auth">${esc(authorNames(feat.authors).join(", "))}</div>
        <p class="f-abs">${esc(abs.slice(0, 340))}${abs.length > 340 ? "…" : ""}</p>
        <div class="f-meta">${metaHTML(feat)}</div>
        <div class="actions"><a class="btn red magnetic" href="article.html?id=${feat.id}">${t("feat.read")} ${ICON.arrow}</a></div>
      </div></div>`;
  }
  const rest = articles.filter(a => a !== feat).slice(0, 6);
  $("#latestCards").innerHTML = rest.length ? rest.map(a => cardHTML(a)).join("")
    : articles.length ? "" : `<div class="empty-state" style="grid-column:1/-1"><div class="es-ic">§</div><b>${t("empty.first")}</b>${t("empty.firstSub")}<br><br><a class="btn red" href="auth.html?mode=signup&next=cabinet.html%23new">${t("hero.cta1")}</a></div>`;
  if (!rest.length && articles.length) $("#latestCards").closest(".wrap").querySelector(".sec-head").style.display = "none";

  const cnt = {}; articles.forEach(a => cnt[a.category] = (cnt[a.category] || 0) + 1);
  $("#rubricGrid").innerHTML = RUBRICS.map(([r, d], i) => `<a class="rb" href="articles.html?rubric=${encodeURIComponent(r)}">
      <span class="rb-n">${ROMAN[i]}</span><h4>${esc(rubricName(r))}</h4><p>${esc(rubricDesc(r, d))}</p>
      <span class="rb-c"><span>${cnt[r] ? num(cnt[r]) + " " + tn("stat.articles", cnt[r]) : t("rb.empty")}</span>${ICON.arrow}</span></a>`).join("");

  const nw = news.filter(n => n.kind === "news").slice(0, 4), it = news.filter(n => n.kind === "interesting").slice(0, 4);
  $("#newsList").innerHTML = nw.length ? nw.map(n => `<a class="nitem reveal" href="news-item.html?id=${n.id}">
      <span class="img" style="${n.cover_url ? `background-image:url('${esc(n.cover_url)}')` : ""}">${n.cover_url ? "" : "§"}</span>
      <span><span class="mono muted">${fmtDate(n.created_at)}</span><h4>${esc(n.title)}</h4><p>${esc(n.summary)}</p></span></a>`).join("")
    : `<p class="muted">${t("news.empty")}</p>`;
  $("#interestList").innerHTML = it.length ? it.map(n => `<a href="news-item.html?id=${n.id}"><b>${esc(n.title)}</b><small>${fmtDate(n.created_at)}</small></a>`).join("")
    : `<a><b>${t("int.empty")}</b></a>`;
  bindFx();
})();
</script>
</body>
