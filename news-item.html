<body>
<div class="progress" id="prog"></div>
<main><article class="news-full" id="n"><div class="empty-state" data-t="c.loading"></div></article></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/key.js"></script>
<script src="assets/config.js?v=20261120g"></script>
<script src="assets/i18n.js?v=20261120g"></script>
<script src="assets/offer.js?v=20261120g"></script>
<script src="assets/app.js?v=20261120g"></script>
<script>
(async () => {
  await boot("news");
  const { data: n } = await sb.from("news").select("*").eq("id", +qs("id")).maybeSingle();
  if (!n) { $("#n").innerHTML = `<div class="empty-state"><div class="es-ic">✦</div><b>${t("nw.notFound")}</b><a class="btn ghost" href="news.html">${t("nw.backAll")}</a></div>`; return; }
  document.title = n.title + " — Lawart";
  const words = String(n.body || "").split(/\s+/).filter(Boolean).length;
  const mins = Math.max(1, Math.round(words / 180));
  const body = String(n.body || "").split(/\n{2,}/).map(p => {
    p = p.trim();
    if (/^##\s/.test(p)) return `<h2>${esc(p.replace(/^##\s/, ""))}</h2>`;
    if (/^>\s/.test(p)) return `<blockquote>${esc(p.replace(/^>\s/, ""))}</blockquote>`;
    if (/^(-|\d+\.)\s/m.test(p) && p.split("\n").every(l => /^(-|\d+\.)\s/.test(l.trim()))) {
      const ol = /^\d+\./.test(p);
      return `<${ol ? "ol" : "ul"}>${p.split("\n").map(l => `<li>${esc(l.trim().replace(/^(-|\d+\.)\s/, ""))}</li>`).join("")}</${ol ? "ol" : "ul"}>`;
    }
    return `<p>${esc(p).replace(/\n/g, "<br>")}</p>`;
  }).join("");
  $("#n").innerHTML = `<nav class="crumbs"><a href="index.html">${t("nav.home")}</a><span>/</span><a href="news.html${n.kind === "interesting" ? "?kind=interesting" : ""}">${n.kind === "news" ? t("nav.news") : t("nav.interesting")}</a></nav>
    <h1>${esc(n.title)}</h1>
    <p class="mono muted">${fmtDate(n.created_at)} · ${mins} ${t("nw.read")}${n.author ? " · " + t("nw.by") + ": " + esc(n.author) : ""}</p>
    ${n.cover_url ? `<div class="cover-img" style="background-image:url('${esc(n.cover_url)}')"></div>` : `<div class="cv-rule" style="margin:30px 0"></div>`}
    ${n.summary ? `<p class="lead">${esc(n.summary)}</p>` : ""}
    <div class="body">${body}</div>
    <div class="actions" style="margin-top:40px"><a class="btn ghost" href="news.html${n.kind === "interesting" ? "?kind=interesting" : ""}">← ${t("nw.backAll")}</a></div>`;
  const prog = $("#prog");
  addEventListener("scroll", () => { const h = document.documentElement.scrollHeight - innerHeight; prog.style.transform = `scaleX(${h > 0 ? scrollY / h : 0})`; }, { passive: true });
})();
</script>
</body>
</html>
