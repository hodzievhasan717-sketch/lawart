<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Новость — Lawart</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500;1,600&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<main class="wrap"><article class="news-full" id="n"><div class="empty-state">Загрузка…</div></article></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/key.js"></script>
<script src="assets/config.js"></script>
<script src="assets/app.js"></script>
<script>
(async () => {
  await boot("news");
  const { data: n } = await sb.from("news").select("*").eq("id", +qs("id")).maybeSingle();
  if (!n) { $("#n").innerHTML = `<div class="empty-state"><b>Материал не найден</b><a href="news.html">Ко всем новостям</a></div>`; return; }
  document.title = n.title + " — Lawart";
  $("#n").innerHTML = `<a class="mono" style="color:var(--oxblood);text-decoration:none" href="news.html${n.kind === "interesting" ? "?kind=interesting" : ""}">← ${n.kind === "news" ? "Новости" : "Интересное"}</a>
    <h1>${esc(n.title)}</h1><p class="mono muted">${fmtDate(n.created_at)}</p>
    ${n.cover_url ? `<div class="cover" style="background-image:url('${esc(n.cover_url)}')"></div>` : ""}
    ${n.summary ? `<p style="font-weight:600;font-size:1.1rem">${esc(n.summary)}</p>` : ""}
    <div class="body">${esc(n.body)}</div>`;
})();
</script>
</body>
</html>
