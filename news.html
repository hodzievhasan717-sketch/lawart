<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link rel="stylesheet" href="assets/style.css?v=20261127c">
</head>
<body>
<main>
  <section class="page-hero night">
    <div class="wrap">
      <span class="kicker"><i></i><span data-t="nw.kicker"></span></span>
      <h1 id="h"></h1>
      <div class="actions" style="margin-top:26px"><a class="chip" href="news.html" id="cN" data-t="nav.news"></a><a class="chip" href="news.html?kind=interesting" id="cI" data-t="nav.interesting"></a></div>
    </div>
    <div class="ph-mark">✦</div>
  </section>
  <div class="wrap"><div class="news-grid" id="grid"></div></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/key.js"></script>
<script src="assets/config.js?v=20261127c"></script>
<script src="assets/i18n.js?v=20261127c"></script>
<script src="assets/offer.js?v=20261127c"></script>
<script src="assets/app.js?v=20261127c"></script>
<script>
(async () => {
  const kind = qs("kind") === "interesting" ? "interesting" : "news";
  await boot(kind === "news" ? "news" : "interesting", { overlay: true });
  $("#h").innerHTML = kind === "news" ? t("nw.newsTitle") : t("nw.intTitle");
  document.title = $("#h").textContent + " — Lawart";
  $(kind === "news" ? "#cN" : "#cI").classList.add("on");
  const { news } = await getIndex();
  const list = news.filter(n => n.kind === kind);
  $("#grid").innerHTML = list.length ? list.map(n => `<a class="ncard tilt reveal" href="news-item.html?id=${n.id}">
      <span class="img" style="${n.cover_url ? `background-image:url('${esc(n.cover_url)}')` : ""}">${n.cover_url ? "" : (kind === "news" ? "§" : "✦")}</span>
      <span class="nc-t"><span class="mono muted">${fmtDate(n.created_at)}</span><h3>${esc(n.title)}</h3><p>${esc(n.summary)}</p></span><span class="glare"></span></a>`).join("")
    : `<div class="empty-state" style="grid-column:1/-1"><div class="es-ic">✦</div><b>${t("nw.empty")}</b>${t("nw.emptySub")}</div>`;
  bindFx();
})();
</script>
</body>
</html>
