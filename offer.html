<script>(async () => {
  await boot("authors", { overlay: true });
  const O = offerT();
  document.title = O.title + " — Lawart";
  $("#ofTitle").textContent = O.title; $("#ofSub").textContent = O.sub; $("#ofDate").textContent = O.date;
  $("#ofShort").innerHTML = O.short.map(([h, p], i) => `<div class="of-card reveal"><span class="mono">0${i + 1}</span><b>${esc(h)}</b><p>${esc(p)}</p></div>`).join("");
  $("#ofBody").innerHTML = O.body;
  reveal();
})();</script>
