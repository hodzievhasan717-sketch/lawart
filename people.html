<body>
<main>
  <section class="page-hero night"><div class="wrap"><span class="kicker"><i></i><span data-t="pl.kicker"></span></span><h1 data-t="pl.title"></h1><p class="lead" data-t="pl.lead"></p>
    <div class="pl-search"><input id="plq" data-tp="pl.search" autocomplete="off"></div></div><div class="ph-mark">§</div></section>
  <div class="wrap pl-wrap">
    <div class="au-grid" id="plGrid"></div>
    <div class="panel pl-cta reveal"><div><h3 data-t="pl.ctaT"></h3><p class="muted" data-t="pl.ctaP"></p></div><a class="btn red" href="cabinet.html#profile" data-t="pl.ctaB"></a></div>
  </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/key.js"></script>
<script src="assets/config.js?v=20261120g"></script>
<script src="assets/i18n.js?v=20261120g"></script>
<script src="assets/offer.js?v=20261120g"></script>
<script src="assets/app.js?v=20261120g"></script>
<script>(async () => {
  await boot("people", { overlay: true });
  const { data } = await sb.rpc("public_authors");
  const all = data || [];
  const paint = () => {
    const q = norm($("#plq").value);
    const list = all.filter(p => !q || norm([p.full_name, p.specialization, p.organization, p.degree].join(" ")).includes(q));
    $("#plGrid").innerHTML = list.length ? list.map(p => `<a class="au-tile tilt" href="profile.html?id=${p.id}">${avatarHTML(p, "xl")}<b>${esc(p.full_name)}</b><span>${esc(p.specialization || "")}</span><span>${esc(p.organization || "")}</span><small class="mono">${num(p.published)} ${tn("stat.articles", p.published)}</small><span class="glare"></span></a>`).join("")
      : `<div class="empty-state" style="grid-column:1/-1"><b>${t(all.length ? "pl.none" : "pl.empty")}</b></div>`;
    bindFx($("#plGrid"));
  };
  $("#plq").oninput = debounce(paint, 120); paint(); reveal();
})();</script>
</body>
</html>
