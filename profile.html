<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Профиль автора — Lawart</title>
<meta name="description" content="Lawart.uz — электронный научный журнал юридических статей Узбекистана. Научные статьи по праву в PDF, публикация статей для студентов, магистрантов и юристов. Huquqiy ilmiy maqolalar jurnali.">
<meta name="keywords" content="Lawart, юридический журнал, научные статьи по праву, публикация статей Узбекистан, право Узбекистана, huquqiy maqolalar, ilmiy jurnal, ТГЮУ">
<meta name="robots" content="index,follow,max-image-preview:large">
<meta property="og:image" content="https://lawart.uz/assets/og.png">
<meta property="og:locale" content="ru_RU">
<meta property="og:title" content="Профиль автора — Lawart">
<meta property="og:description" content="Научный журнал, где право становится искусством аргумента.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Lawart">
<meta name="theme-color" content="#0b0c10">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" href="/icon-192.png" type="image/png" sizes="192x192">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<meta property="og:site_name" content="Lawart">
<meta name="application-name" content="Lawart">
<script>try{var th=localStorage.getItem('lawart-theme');if(th)document.documentElement.dataset.theme=th;var lg=localStorage.getItem('lawart-lang');if(lg)document.documentElement.lang=lg}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://xgwzpygoewtfeexraats.supabase.co">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500;1,600&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css?v=20261120i">
</head>
<body>
<main id="pp">
  <section class="page-hero night pp-hero"><div class="wrap"><div class="pp-skel"></div></div></section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/key.js"></script>
<script src="assets/config.js?v=20261120i"></script>
<script src="assets/i18n.js?v=20261120i"></script>
<script src="assets/offer.js?v=20261120i"></script>
<script src="assets/app.js?v=20261120i"></script>
<script>
(async () => {
  await boot("people", { overlay: true });
  const id = qs("id");
  const { data: p } = id ? await sb.rpc("public_profile", { p_id: id }) : { data: null };
  if (!p) {
    $("#pp").innerHTML = `<section class="page-hero night pp-hero"><div class="wrap"><span class="kicker"><i></i>${t("pp.kicker")}</span><h1>${t("pp.closedT")}</h1><p class="lead">${t("pp.closed")}</p>
      <div class="actions" style="margin-top:22px"><a class="btn gold" href="articles.html">${t("pp.toArticles")}</a></div></div><div class="ph-mark">§</div></section>`;
    return;
  }
  document.title = p.full_name + " — Lawart";
  const mine = ME.user && ME.user.id === p.id;
  const exp = Array.isArray(p.experience) ? p.experience : [];
  const gal = Array.isArray(p.gallery) ? p.gallery : [];
  const sub = [p.degree, p.position].filter(Boolean).join(", ");
  const contacts = [
    p.email ? `<a class="ct" href="mailto:${esc(p.email)}">${ICON.mail || "✉"}<span><small>Email</small>${esc(p.email)}</span></a>` : "",
    p.phone ? `<a class="ct" href="tel:${esc(p.phone.replace(/[^\d+]/g, ""))}">☎<span><small>${t("cb.pPhone")}</small>${esc(p.phone)}</span></a>` : "",
    p.telegram ? `<a class="ct" href="https://t.me/${esc(p.telegram.replace(/^@|https?:\/\/t\.me\//g, ""))}" target="_blank" rel="noopener">✈<span><small>Telegram</small>${esc(p.telegram)}</span></a>` : ""
  ].join("");
  $("#pp").innerHTML = `
  <section class="page-hero night pp-hero">
    <div class="wrap pp-head">
      <div class="pp-photo reveal">${avatarHTML(p, "xxl")}<span class="pp-ring"></span></div>
      <div class="pp-id reveal">
        <span class="kicker"><i></i>${p.specialization ? esc(p.specialization) : t("pp.kicker")}</span>
        <h1>${esc(p.full_name)}</h1>
        ${sub ? `<p class="pp-sub">${esc(sub)}</p>` : ""}
        <p class="pp-meta">${[p.organization, p.city].filter(Boolean).map(esc).join(" · ")}</p>
        <div class="pp-stats"><div><b>${num(p.published)}</b><span>${tn("stat.articles", p.published)}</span></div><div><b>${num(p.views)}</b><span>${t("pp.reads")}</span></div><div><b>${new Date(p.created_at).getFullYear()}</b><span>${t("pp.since")}</span></div></div>
        ${!mine && (p.email || p.phone || p.telegram) ? `<div class="actions" style="margin-top:20px"><a class="btn gold" href="${p.telegram ? "https://t.me/" + esc(p.telegram.replace(/^@|https?:\/\/t\.me\//g, "")) : p.email ? "mailto:" + esc(p.email) : "tel:" + esc(p.phone.replace(/[^\d+]/g, ""))}" ${p.telegram ? 'target="_blank" rel="noopener"' : ""}>${t("pp.contactBtn")} ${ICON.arrow}</a>${p.email && p.telegram ? `<a class="btn ghost-light" href="mailto:${esc(p.email)}">${t("pp.writeEmail")}</a>` : ""}</div>` : ""}
        ${mine ? `<div class="actions" style="margin-top:18px"><a class="btn gold sm" href="cabinet.html#profile">${t("pp.edit")}</a>${p.is_public ? "" : `<span class="badge b-pending">${t("pp.privateNote")}</span>`}</div>` : ""}
      </div>
    </div>
    <div class="ph-mark">§</div>
  </section>
  <div class="wrap pp-body">
    <div class="pp-main">
      ${p.bio ? `<div class="panel reveal"><h2>${t("pp.about")}</h2><div class="pp-bio">${esc(p.bio).split(/\n{2,}/).map(x => `<p>${x.replace(/\n/g, "<br>")}</p>`).join("")}</div></div>` : ""}
      ${exp.length ? `<div class="panel reveal"><h2>${t("pp.exp")}</h2><ol class="tl">${exp.map(x => `<li><span class="tl-dot"></span><small class="mono">${esc(x.period || "")}</small><b>${esc(x.role || "")}</b><span>${esc(x.org || "")}</span></li>`).join("")}</ol></div>` : ""}
      ${gal.length ? `<div class="panel reveal"><h2>${t("pp.gallery")}</h2><div class="pp-gal">${gal.map((u, i) => `<button class="pp-g tilt" data-i="${i}" style="background-image:url('${esc(u)}')" aria-label="${t("pp.photo")} ${i + 1}"><span class="glare"></span></button>`).join("")}</div></div>` : ""}
      <div class="panel reveal"><h2>${t("pp.articles")}</h2><div id="ppArts" class="pp-arts">${t("c.loading")}</div></div>
    </div>
    <aside class="pp-side">
      <div class="side-card reveal pp-facts"><h4>${t("pp.facts")}</h4><dl>${[[t("pr.spec"), p.specialization], [t("cb.pDegree"), p.degree], [t("cb.pPosition"), p.position], [t("cb.pOrg"), p.organization], [t("pr.city"), p.city]].filter(x => x[1]).map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join("")}</dl></div>
      <div class="side-card reveal"><h4>${t("pp.contacts")}</h4>${contacts || `<p class="muted small">${t("pp.noContacts")}</p>`}</div>
      ${p.orcid ? `<div class="side-card reveal"><h4>ORCID</h4><a class="link" href="https://orcid.org/${esc(p.orcid)}" target="_blank" rel="noopener">${esc(p.orcid)}</a></div>` : ""}
      <div class="side-card reveal"><h4>${t("pp.share")}</h4><button class="btn ghost sm" id="ppShare">${t("pp.copyLink")}</button></div>
    </aside>
  </div>`;
  $$(".pp-g").forEach(b => b.onclick = () => lightbox(gal, +b.dataset.i));
  const ph = $(".pp-photo .avatar.ph"); if (ph) ph.onclick = () => lightbox([p.photo_url]);
  $("#ppShare").onclick = () => copyText(location.href.split("#")[0]);
  const { data: arts } = await sb.from("articles").select(ART_COLS)
    .eq("author_id", p.id).eq("status", "published").order("published_at", { ascending: false });
  $("#ppArts").innerHTML = arts && arts.length ? `<div class="pp-list">${arts.map(a => cardHTML(a)).join("")}</div>` : `<p class="muted">${t("pp.noArticles")}</p>`;
  reveal(); bindFx($("#pp"));
})();
</script>
</body>
</html>
